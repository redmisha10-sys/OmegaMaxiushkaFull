<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                   user-scalable=no, viewport-fit=cover">
    <title>Omega Maxiushka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- NEW: Stats Sidebar on the left -->
        <div id="stats-sidebar">
            <h3 class="red-title">PRO-RUSSIAN:</h3>
            <div class="stat-row"><span>ГОЙДА:</span> <span id="stat-goyda">10</span></div>
            <div class="stat-row"><span>СВО:</span> <span id="stat-svo">0</span></div>
            <div class="stat-row"><span>ДВИЖУХА:</span> <span id="stat-dvizhuha">10</span></div>
            <div class="stat-row"><span>ZOV:</span> <span id="stat-zov">10</span></div>
            
            <hr class="stat-divider">
            
            <h3 class="blue-title">PRO-UKRAINIAN:</h3>
            <div class="stat-row"><span>ПОТУЖНІСТЬ:</span> <span id="stat-potuzhnist">10</span></div>
            <div class="stat-row"><span>ІПСО+НАХРЮК:</span> <span id="stat-ipso">10</span></div>
            <div class="stat-row"><span>ПЕРЕМОГА:</span> <span id="stat-peremoha">0</span></div>
            <div class="stat-row"><span>ЗРАДА:</span> <span id="stat-zrada">0</span></div>
        </div>

        <!-- The actual game canvas -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div id="mobile-controls" class="hidden">
                <div id="joystick-zone">
                    <div id="joystick-base">
                        <div id="joystick-knob"></div>
                    </div>
                </div>
                <button id="interact-btn" aria-label="Interact">Z</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
